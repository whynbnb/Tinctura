name: Tinctura
options:
  bundleIdPrefix: me.whynbnb
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"

configs:
  Debug: debug
  Release: release

targets:
  Tinctura:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/Tinctura
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.whynbnb.Tinctura
        PRODUCT_NAME: Tinctura
        INFOPLIST_KEY_CFBundleDisplayName: Tinctura
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSSupportsAutomaticGraphicsSwitching: YES
        GENERATE_INFOPLIST_FILE: YES
        # Screen recording permission for magnifier picker
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: "Tinctura 需要屏幕录制权限以进行实时屏幕取色与放大镜预览。"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
      gatherCoverageData: false
